name: Question
description: Ask about proto usage, code generation, or versioning.
title: "[Question] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Chinese.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - proto usage
        - code generation
        - versioning / compatibility
        - other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: Explain what you are trying to do and what you already tried.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
