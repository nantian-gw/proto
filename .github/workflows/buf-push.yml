name: Buf Push

on:
  push:
    branches: [main]
    paths:
      - '**.proto'
      - 'buf.yaml'
      - 'buf.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Push to BSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Buf CLI
        env:
          BUF_VERSION: 1.70.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$RUNNER_TEMP/bin/buf"
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version

      - name: Buf lint
        run: buf lint .

      - name: Buf breaking change check
        run: buf breaking . --against "https://github.com/${{ github.repository }}.git#ref=HEAD~1"

      - name: Buf push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push .
