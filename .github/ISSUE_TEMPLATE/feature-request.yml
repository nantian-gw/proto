name: Feature Request
description: Suggest a new proto definition, field, or tooling improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Chinese.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - proto schema
        - codegen
        - release / CI
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      placeholder: What is missing and why.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      placeholder: Describe the new message, field, or service definition.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Backward Compatibility
      description: Does this change break existing consumers?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the existing issues for similar requests.
          required: true
