name: Generate Proto

on:
  push:
    branches: [main]
    paths:
      - '**.proto'
      - 'Makefile'
      - 'buf.yaml'
      - 'buf.gen.yaml'
  pull_request:
    paths:
      - '**.proto'
      - 'Makefile'
      - 'buf.yaml'
      - 'buf.gen.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Proto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Buf CLI
        env:
          BUF_VERSION: 1.70.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o "$RUNNER_TEMP/bin/buf"
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/buf" --version
      - name: Buf lint
        run: buf lint
      - name: Breaking change check
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: Buf generate
        run: buf generate
      - name: Check generated code is up to date
        run: |
          if ! git diff --exit-code gateway/control/v1/control.pb.go gateway/control/v1/control_grpc.pb.go; then
            echo "::error::Generated .pb.go files are out of date. Run 'buf generate' or 'make generate' locally and push the changes."
            echo ""
            echo "Changes detected:"
            git diff --stat gateway/control/v1/control.pb.go gateway/control/v1/control_grpc.pb.go
            exit 1
          fi
          echo "Generated code is up to date."
