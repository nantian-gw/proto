// Nantian Gateway xDS Control-Plane Protocol
//
// This is the umbrella file for the gateway.control.v1 package.
// All type definitions have been split into domain-specific files:
//
//   discovery.proto  — DiscoveryService, DeltaDiscoveryService, discovery messages
//   config.proto     — ConfigSnapshot, listeners, routes, backends, TLS, session persistence
//   ai.proto         — AIServiceConfig, TokenPolicyConfig
//   wasm.proto       — WasmPluginConfig, WasmSandboxConfig
//   route_policy.proto — RoutePolicy, RoutePolicyTimeout, etc.
//
// This file imports all domain files and re-exports the package for
// backward compatibility. New code should import the specific domain
// file instead of this umbrella.

syntax = "proto3";

package gateway.control.v1;

import "gateway/control/v1/ai.proto";
import "gateway/control/v1/config.proto";
import "gateway/control/v1/discovery.proto";
import "gateway/control/v1/route_policy.proto";
import "gateway/control/v1/wasm.proto";

option go_package = "github.com/nantian-gw/proto/gateway/control/v1;controlv1";

