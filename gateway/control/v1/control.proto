// Nantian Gateway xDS Control-Plane Protocol
//
// This file defines the gRPC-based xDS (discovery service) contract between
// the Go control plane and Rust data plane. The control plane acts as the
// xDS management server, pushing configuration snapshots (listeners, routes,
// backends, secrets) to data-plane instances via bi-directional streaming.
//
// Protocol flow:
//   1. Data plane opens a StreamConfiguration RPC, sending a DiscoveryRequest
//      with its node identity and subscribed resource types.
//   2. Control plane responds with a DiscoveryResponse containing a full
//      ConfigSnapshot.
//   3. Data plane acknowledges (ACK) or rejects (NACK) the snapshot.
//   4. On any configuration change, the control plane pushes a new snapshot.
//   5. Data plane periodically reports health/readiness via ReportStatus.

syntax = "proto3";

package gateway.control.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/nantian-gw/proto/gateway/control/v1;controlv1";

// ConfigurationDiscoveryService is the core xDS control-plane API.
// Data-plane instances use this service to receive configuration
// and report operational status back to the control plane.
service ConfigurationDiscoveryService {
  // StreamConfiguration establishes a bi-directional stream for xDS
  // configuration delivery. The data plane sends DiscoveryRequest
  // messages to subscribe to resources; the control plane responds
  // with DiscoveryResponse messages containing ConfigSnapshots.
  rpc StreamConfiguration(stream DiscoveryRequest) returns (stream DiscoveryResponse);

  // ReportStatus allows the data plane to report its health and readiness
  // to the control plane. Called periodically (typically every 10-30s).
  rpc ReportStatus(StatusReport) returns (StatusAck);
}

// DeltaDiscoveryService is the incremental xDS API for efficient
// configuration delivery. Unlike SotW (state-of-the-world), only
// changed resources are pushed. Data planes maintain their own
// resource state and request updates for specific resources.
//
// Protocol flow:
//   1. Data plane opens DeltaStreamConfiguration, sending a
//      DeltaDiscoveryRequest with initial resource subscriptions.
//   2. Control plane responds with a DeltaDiscoveryResponse containing
//      subscribed resources (full initial state).
//   3. On config change, control plane computes diff and pushes only
//      added/changed/removed resources.
//   4. Data plane ACKs/NACKs each response individually.
service DeltaDiscoveryService {
  // DeltaStreamConfiguration is the incremental-equivalent of
  // StreamConfiguration. Subscriptions are per-resource and can be
  // dynamically changed mid-stream.
  rpc DeltaStreamConfiguration(stream DeltaDiscoveryRequest) returns (stream DeltaDiscoveryResponse);
}

// DeltaDiscoveryRequest carries per-resource subscription updates,
// ACK/NACK responses, and resource version tracking for incremental
// configuration delivery.
message DeltaDiscoveryRequest {
  // Unique identifier for this data-plane instance (e.g. pod name).
  string node_id = 1;
  // Kubernetes cluster name the data plane belongs to.
  string cluster = 2;

  // --- Subscription management ---
  // Resource type URLs to subscribe to (e.g. "type.googleapis.com/gateway.control.v1.Listener").
  // Sent on initial connection and when the data plane wants to add subscriptions.
  repeated string resource_names_subscribe = 3;
  // Resource type URLs to unsubscribe from.
  repeated string resource_names_unsubscribe = 4;

  // --- Resource version tracking ---
  // Map from resource type URL to per-resource version strings.
  // Sent on initial connection to seed the control plane's per-client state.
  // Format: key=type_url, value=map<resource_name, version> serialized as JSON.
  map<string, string> initial_resource_versions = 5;

  // --- ACK/NACK ---
  // Nonce from the last received DeltaDiscoveryResponse, echoed back for correlation.
  string response_nonce = 6;
  // Type URL of the resource being acknowledged/rejected.
  string type_url = 7;
  // Whether the last delta response was accepted or rejected.
  DiscoveryResultStatus result_status = 8;
  // Human-readable error detail when result_status is NACK.
  string error_detail = 9;

  // --- Capability negotiation ---
  // Features this data plane supports (e.g. "incremental-config", "wildcard-subscription").
  repeated string supported_features = 10;
}

// DeltaDiscoveryResponse carries a batch of resource changes for a
// single resource type. The control plane sends one response per
// resource type that has changes.
message DeltaDiscoveryResponse {
  // System version identifier (monotonically increasing).
  string system_version_info = 1;
  // Unique nonce for this response. The data plane echoes it back in
  // the next DeltaDiscoveryRequest for ACK/NACK correlation.
  string nonce = 2;

  // --- Resource payload ---
  // Type URL for the resources in this response.
  string type_url = 3;
  // Resources that were added or changed since the last response.
  // Each Resource wraps the actual proto payload in google.protobuf.Any
  // and carries its own name and version.
  repeated Resource resources = 4;
  // Names of resources that were removed (no longer present in the
  // control plane's state). The data plane should delete these from
  // its local cache.
  repeated string removed_resources = 5;

  // --- Wildcard (non-incremental) ---
  // If true, this response replaces ALL resources of this type_url,
  // not just the changed ones. Equivalent to a SotW push for this type.
  bool non_incremental = 6;
}

// Resource wraps a single xDS resource with its name, version, and
// serialized payload. The payload is an opaque google.protobuf.Any
// that the data plane unmarshals based on type_url.
message Resource {
  // Unique name of this resource within its type (e.g. listener name, route name).
  string name = 1;
  // Version of this resource. Changes when the resource content changes.
  // Used by the control plane to compute diffs per-client.
  string version = 2;
  // The actual resource payload, serialized as google.protobuf.Any.
  // The type URL in the Any matches the type_url in DeltaDiscoveryResponse.
  google.protobuf.Any resource = 3;
  // Optional alias for this resource (used for LDS→RDS indirection, etc.).
  string alias = 4;
  // Time-to-live hint. If set, the data plane should re-request this
  // resource before the TTL expires. 0 means indefinite.
  google.protobuf.Duration ttl = 5;
}

// DiscoveryResultStatus encodes the data plane's response to a received
// ConfigSnapshot: ACK means accepted and applied, NACK means rejected.
enum DiscoveryResultStatus {
  // Default unspecified value. Should not be used.
  DISCOVERY_RESULT_STATUS_UNSPECIFIED = 0;
  // The ConfigSnapshot was accepted and successfully applied.
  DISCOVERY_RESULT_STATUS_ACK = 1;
  // The ConfigSnapshot was rejected. See error_detail for the reason.
  DISCOVERY_RESULT_STATUS_NACK = 2;
}

// DiscoveryRequest is sent by the data plane when opening or updating
// a configuration stream, and after receiving a DiscoveryResponse to
// acknowledge or reject the snapshot.
message DiscoveryRequest {
  // Unique identifier for this data-plane instance (e.g. pod name).
  string node_id = 1;
  // Kubernetes cluster name the data plane belongs to.
  string cluster = 2;
  // Last accepted configuration version, used for incremental sync.
  string version = 3;
  // Nonce from the last received DiscoveryResponse, echoed back for ACK/NACK correlation.
  string nonce = 4;
  // Resource type URLs this data-plane instance subscribes to.
  repeated string subscriptions = 5;
  // Whether the last snapshot was accepted or rejected.
  DiscoveryResultStatus result_status = 6;
  // Human-readable error detail when result_status is NACK.
  string error_detail = 7;
  // List of optional features this data plane supports, used for
  // capability negotiation (e.g. "config-sync", "access-log-v2").
  repeated string supported_features = 8;
}

// DiscoveryResponse is sent by the control plane in reply to a
// DiscoveryRequest, carrying a full ConfigSnapshot.
message DiscoveryResponse {
  // Configuration version identifier. Incremented on every snapshot change.
  string version = 1;
  // Unique nonce for this response. The data plane echoes it back in the
  // next DiscoveryRequest for ACK/NACK correlation.
  string nonce = 2;
  // The complete configuration snapshot.
  ConfigSnapshot snapshot = 3;
}

// StatusReport is sent periodically by the data plane to inform the
// control plane of its current health and readiness.
message StatusReport {
  // Unique identifier for this data-plane instance.
  string node_id = 1;
  // Currently applied configuration version.
  string version = 2;
  // Whether the data plane is ready to serve traffic.
  bool ready = 3;
  // Human-readable status message (e.g. "healthy", "degraded: no backends").
  string message = 4;
  // Timestamp when this status was observed.
  google.protobuf.Timestamp observed_at = 5;
}

// StatusAck is the control plane's acknowledgement of a StatusReport.
// It confirms receipt and optionally carries back instructions to the
// data plane (future: e.g. "reload", "drain", "shutdown").
message StatusAck {
  // Whether the status report was received and processed successfully.
  bool accepted = 1;
}

// ConfigSnapshot is a point-in-time, self-consistent configuration bundle
// pushed from the control plane to the data plane. Every field is replaced
// wholesale on each push (full-state snapshot, not delta).
message ConfigSnapshot {
  // Unique snapshot identifier, typically a UUID or content hash.
  string id = 1;
  // Timestamp when this snapshot was generated by the control plane.
  google.protobuf.Timestamp generated_at = 2;
  // All active listeners (port bindings).
  repeated Listener listeners = 3;
  // All HTTP route rules.
  repeated HttpRoute http_routes = 4;
  // All gRPC route rules.
  repeated GrpcRoute grpc_routes = 5;
  // All TCP/UDP/TLS stream route rules.
  repeated StreamRoute stream_routes = 6;
  // All backend clusters (upstream service discovery results).
  repeated BackendCluster backends = 7;
  // TLS certificate/key material referenced by listeners and backends.
  repeated SecretMaterial secrets = 8;
  // Arbitrary extension data, keyed by extension name.
  google.protobuf.Struct extensions = 9;
  // Features the control plane requires the data plane to support
  // for this snapshot to be safely applied.
  repeated string required_features = 10;
  // Named compatibility profile (e.g. "v1", "experimental"). The data plane
  // uses this to enable/disable behavior flags atomically.
  string compatibility_profile = 11;
  // W3C TraceContext traceparent header value. The control plane injects
  // its current trace context so the data plane can create child spans
  // linked to the snapshot generation trace.
  string traceparent = 20;
}

// ListenerProtocol enumerates the transport-layer protocols a listener can serve.
enum ListenerProtocol {
  // Default unspecified value. Should not be used.
  LISTENER_PROTOCOL_UNSPECIFIED = 0;
  // Plain HTTP/1.1 and HTTP/2 (H2C).
  LISTENER_PROTOCOL_HTTP = 1;
  // HTTPS with TLS termination at the data plane.
  LISTENER_PROTOCOL_HTTPS = 2;
  // gRPC (HTTP/2 with application/grpc content type).
  LISTENER_PROTOCOL_GRPC = 3;
  // HTTP/3 over QUIC.
  LISTENER_PROTOCOL_HTTP3 = 4;
  // Raw TCP proxying.
  LISTENER_PROTOCOL_TCP = 5;
  // Raw UDP proxying.
  LISTENER_PROTOCOL_UDP = 6;
  // TLS passthrough — the data plane forwards the TLS handshake
  // without termination, routing based on SNI.
  LISTENER_PROTOCOL_TLS_PASSTHROUGH = 7;
  // Generic TLS with termination at the data plane.
  LISTENER_PROTOCOL_TLS = 8;
}

// TlsRouteMode controls how a stream (TCP/TLS) listener handles TLS connections.
enum TlsRouteMode {
  // Default unspecified value. Should not be used.
  TLS_ROUTE_MODE_UNSPECIFIED = 0;
  // Forward the raw TLS stream to the backend without termination.
  TLS_ROUTE_MODE_PASSTHROUGH = 1;
  // Terminate TLS at the data plane and forward plain text to the backend.
  TLS_ROUTE_MODE_TERMINATE = 2;
}

// RouteKind classifies a stream route by transport protocol.
enum RouteKind {
  // Default unspecified value. Should not be used.
  ROUTE_KIND_UNSPECIFIED = 0;
  // HTTP route (layer 7, path/host/header matching).
  ROUTE_KIND_HTTP = 1;
  // gRPC route (layer 7, service/method matching).
  ROUTE_KIND_GRPC = 2;
  // Raw TCP stream route (layer 4, port matching).
  ROUTE_KIND_TCP = 3;
  // Raw UDP stream route (layer 4, port matching).
  ROUTE_KIND_UDP = 4;
  // TLS stream route (layer 4, SNI matching).
  ROUTE_KIND_TLS = 5;
}

// Listener describes a port binding on the data plane. Each listener
// has a protocol, optional TLS settings, and references to route rules
// that determine how traffic is dispatched.
message Listener {
  // Unique name for this listener within the data-plane instance.
  string name = 1;
  // IP address to bind to (e.g. "0.0.0.0" for all interfaces).
  string address = 2;
  // TCP/UDP port to listen on.
  uint32 port = 3;
  // Transport protocol for this listener.
  ListenerProtocol protocol = 4;
  // Hostnames this listener accepts (SNI matching for TLS, Host header for HTTP).
  repeated string hostnames = 5;
  // Names of route rules attached to this listener. The data plane
  // resolves these against the snapshot's route tables.
  repeated string attached_routes = 6;
  // TLS configuration for this listener (required for HTTPS/TLS protocols).
  TlsConfig tls = 7;
  // Arbitrary key-value metadata.
  map<string, string> metadata = 8;
  // Default TLS settings applied to backends reached through this listener.
  // Overridden by per-route or per-backend TLS config when present.
  BackendTlsConfig backend_tls = 9;
  // Additional addresses to bind (for dual-stack or multi-interface setups).
  repeated string addresses = 10;
}

// TlsConfig specifies TLS settings for a listener's frontend (client-facing) side.
message TlsConfig {
  // Whether TLS is enabled on this listener.
  bool enabled = 1;
  // If true, forward TLS without termination (passthrough mode).
  bool passthrough = 2;
  // References to SecretMaterial entries containing server certificate/key pairs.
  repeated string secret_refs = 3;
  // Server Name Indication hostnames this listener responds to.
  repeated string sni_hosts = 4;
  // Minimum TLS version (e.g. "1.2", "1.3").
  string min_version = 5;
  // Maximum TLS version (e.g. "1.3").
  string max_version = 6;
  // Client certificate validation settings (mTLS).
  FrontendValidation frontend_validation = 7;
}

// FrontendValidation controls client certificate verification (mTLS) for a listener.
message FrontendValidation {
  // PEM-encoded CA certificates used to verify client certificates.
  repeated string ca_pems = 1;
  // Validation mode: "strict" (require client cert), "optional" (request but don't require),
  // or empty (no client cert validation).
  string mode = 2;
}

// BackendTlsConfig specifies the client-side TLS settings for connecting
// to an upstream backend from a listener.
message BackendTlsConfig {
  // Reference to a SecretMaterial entry containing the client certificate
  // and key pair for backend mTLS.
  string client_certificate_ref = 1;
}

// BackendTlsValidation controls how the data plane validates the backend's TLS certificate.
message BackendTlsValidation {
  // Expected hostname in the backend's certificate (SNI).
  string hostname = 1;
  // If true, use the system's CA certificate store in addition to ca_pems.
  bool use_system_ca_certificates = 2;
  // PEM-encoded CA certificates used to verify the backend's certificate.
  repeated string ca_pems = 3;
  // Subject Alternative Names the backend certificate must match.
  repeated BackendTlsSubjectAltName subject_alt_names = 4;
  // Minimum acceptable TLS version for the backend connection.
  string min_version = 5;
  // Maximum TLS version for the backend connection.
  string max_version = 6;
}

// BackendTlsSubjectAltNameType classifies SAN entries in backend certificates.
enum BackendTlsSubjectAltNameType {
  // Default unspecified value. Should not be used.
  BACKEND_TLS_SUBJECT_ALT_NAME_TYPE_UNSPECIFIED = 0;
  // DNS hostname (e.g. "backend.example.com").
  BACKEND_TLS_SUBJECT_ALT_NAME_TYPE_HOSTNAME = 1;
  // URI (e.g. "spiffe://cluster.local/ns/default/sa/backend").
  BACKEND_TLS_SUBJECT_ALT_NAME_TYPE_URI = 2;
}

// BackendTlsSubjectAltName describes a single Subject Alternative Name
// constraint for backend certificate validation.
message BackendTlsSubjectAltName {
  // Type of SAN entry (hostname or URI).
  BackendTlsSubjectAltNameType type = 1;
  // The SAN value to match against the backend certificate.
  string value = 2;
}

// HttpRoute defines HTTP-level routing rules. It is the xDS representation
// of a Kubernetes HTTPRoute resource after Gateway API translation.
message HttpRoute {
  // Route name (matches the Kubernetes resource name).
  string name = 1;
  // Kubernetes namespace of the route resource.
  string namespace = 2;
  // Hostnames this route matches (Host header).
  repeated string hostnames = 3;
  // References to parent Gateway listeners this route attaches to.
  repeated ParentRef parent_refs = 4;
  // Ordered list of HTTP routing rules. First match wins.
  repeated HttpRule rules = 5;
  // Kubernetes labels from the route resource.
  map<string, string> labels = 6;
  // Kubernetes annotations from the route resource.
  map<string, string> annotations = 7;
  // Per-route policy overrides for timeout, body size, proxy buffering,
  // and connection keepalive settings.
  RoutePolicy route_policy = 8;
}

// HttpRule defines a single HTTP routing rule: match conditions, filters
// to apply, and backends to forward to.
message HttpRule {
  // Match conditions. ALL matches must be satisfied (AND semantics).
  // At least one match is required.
  repeated HttpMatch matches = 1;
  // Filters applied to the request before forwarding (e.g. header modification,
  // URL rewrite, rate limiting).
  repeated Filter filters = 2;
  // Backends to forward matching requests to. Multiple backends imply
  // weighted load balancing.
  repeated BackendRef backend_refs = 3;
  // Request and backend timeout settings for this rule.
  HttpRouteTimeouts timeouts = 4;
  // Retry policy for failed requests on this rule.
  HttpRouteRetry retry = 5;
  // Session persistence configuration (sticky sessions).
  SessionPersistence session_persistence = 6;
  // Optional human-readable name for this rule.
  string name = 7;
}

// HttpMatch defines request matching criteria for an HTTP route rule.
message HttpMatch {
  // URL path pattern to match (e.g. "/api/v1/").
  string path = 1;
  // Path match type: "Exact", "PathPrefix", or "RegularExpression".
  string path_type = 2;
  // HTTP method to match (GET, POST, PUT, DELETE, etc.). Empty matches all.
  string method = 3;
  // Header match conditions. All must match (AND semantics).
  repeated HeaderMatch headers = 4;
  // Query parameter match conditions. All must match (AND semantics).
  repeated QueryMatch query_params = 5;
}

// HttpRouteTimeouts specifies timeout values for HTTP requests on a route rule.
message HttpRouteTimeouts {
  // Maximum duration for the entire request-response cycle.
  google.protobuf.Duration request = 1;
  // Maximum duration for a single backend request attempt.
  google.protobuf.Duration backend_request = 2;
}

// HttpRouteRetry defines the retry policy for failed HTTP requests.
message HttpRouteRetry {
  // HTTP status codes that trigger a retry (e.g. 502, 503, 504).
  repeated uint32 codes = 1;
  // Maximum number of retry attempts.
  uint32 attempts = 2;
  // Backoff duration between retry attempts.
  google.protobuf.Duration backoff = 3;
}

// SessionPersistenceType selects the mechanism for sticky sessions.
enum SessionPersistenceType {
  // Default unspecified value. Should not be used.
  SESSION_PERSISTENCE_TYPE_UNSPECIFIED = 0;
  // Use a cookie to track session affinity.
  SESSION_PERSISTENCE_TYPE_COOKIE = 1;
  // Use a request header to track session affinity.
  SESSION_PERSISTENCE_TYPE_HEADER = 2;
}

// CookieLifetimeType controls the lifetime of session persistence cookies.
enum CookieLifetimeType {
  // Default unspecified value. Should not be used.
  COOKIE_LIFETIME_TYPE_UNSPECIFIED = 0;
  // Cookie expires when the browser session ends.
  COOKIE_LIFETIME_TYPE_SESSION = 1;
  // Cookie persists across browser sessions (absolute timeout).
  COOKIE_LIFETIME_TYPE_PERMANENT = 2;
}

// CookieConfig specifies cookie-based session persistence settings.
message CookieConfig {
  // Cookie lifetime behavior (session or permanent).
  CookieLifetimeType lifetime_type = 1;
}

// SessionPersistence configures sticky sessions so requests from the same
// client are routed to the same backend.
message SessionPersistence {
  // Name of the session cookie or header.
  string session_name = 1;
  // Maximum session duration. The session expires after this time regardless
  // of activity.
  google.protobuf.Duration absolute_timeout = 2;
  // Session expires after this duration of inactivity.
  google.protobuf.Duration idle_timeout = 3;
  // Persistence mechanism (cookie or header).
  SessionPersistenceType type = 4;
  // Cookie-specific settings (only relevant when type is COOKIE).
  CookieConfig cookie = 5;
}

// LoadBalancingPolicyType selects the load balancing algorithm for a backend cluster.
enum LoadBalancingPolicyType {
  // Default unspecified value. Should not be used.
  LOAD_BALANCING_POLICY_TYPE_UNSPECIFIED = 0;
  // Distribute requests evenly across all healthy backends.
  LOAD_BALANCING_POLICY_TYPE_ROUND_ROBIN = 1;
  // Hash requests to consistently map the same client to the same backend.
  LOAD_BALANCING_POLICY_TYPE_CONSISTENT_HASH = 2;
}

// ConsistentHashKeyType selects the key used for consistent-hash load balancing.
enum ConsistentHashKeyType {
  // Default unspecified value. Should not be used.
  CONSISTENT_HASH_KEY_TYPE_UNSPECIFIED = 0;
  // Hash based on the client's source IP address.
  CONSISTENT_HASH_KEY_TYPE_SOURCE_IP = 1;
  // Hash based on a specific request header value.
  CONSISTENT_HASH_KEY_TYPE_HEADER = 2;
  // Hash based on the request's Host header.
  CONSISTENT_HASH_KEY_TYPE_HOSTNAME = 3;
}

// ConsistentHashPolicy configures consistent-hash load balancing behavior.
message ConsistentHashPolicy {
  // The hash key type (source IP, header, or hostname).
  ConsistentHashKeyType key_type = 1;
  // Header name to hash on (required when key_type is HEADER).
  string header_name = 2;
}

// LoadBalancingPolicy configures load balancing for a backend cluster.
message LoadBalancingPolicy {
  // Load balancing algorithm to use.
  LoadBalancingPolicyType type = 1;
  // Consistent-hash settings (required when type is CONSISTENT_HASH).
  ConsistentHashPolicy consistent_hash = 2;
}

// GrpcRoute defines gRPC-level routing rules. It is the xDS representation
// of a Kubernetes GRPCRoute resource.
message GrpcRoute {
  // Route name (matches the Kubernetes resource name).
  string name = 1;
  // Kubernetes namespace of the route resource.
  string namespace = 2;
  // Hostnames this route matches (Host header or :authority).
  repeated string hostnames = 3;
  // References to parent Gateway listeners this route attaches to.
  repeated ParentRef parent_refs = 4;
  // Ordered list of gRPC routing rules. First match wins.
  repeated GrpcRule rules = 5;
  // Kubernetes labels from the route resource.
  map<string, string> labels = 6;
  // Kubernetes annotations from the route resource.
  map<string, string> annotations = 7;
  // Per-route policy overrides for timeout, body size, proxy buffering,
  // and connection keepalive settings.
  RoutePolicy route_policy = 8;
}

// GrpcRule defines a single gRPC routing rule: service/method matching,
// filters, and backend forwarding.
message GrpcRule {
  // Match conditions. ALL matches must be satisfied (AND semantics).
  repeated GrpcMatch matches = 1;
  // Filters applied to the gRPC call before forwarding.
  repeated Filter filters = 2;
  // Backends to forward matching requests to.
  repeated BackendRef backend_refs = 3;
  // Session persistence configuration for sticky gRPC sessions.
  SessionPersistence session_persistence = 4;
  // Optional human-readable name for this rule.
  string name = 5;
}

// GrpcMatch defines request matching criteria for a gRPC route rule.
message GrpcMatch {
  // Fully qualified gRPC service name (e.g. "helloworld.Greeter").
  string service = 1;
  // gRPC method name (e.g. "SayHello"). Empty matches all methods of the service.
  string method = 2;
  // Header match conditions (metadata headers). All must match (AND semantics).
  repeated HeaderMatch headers = 3;
  // Match type: "Exact" or "RegularExpression".
  string match_type = 4;
}

// StreamRoute defines TCP/UDP/TLS stream-level routing rules. It is the
// xDS representation of a Kubernetes TLSRoute/TCPRoute/UDPRoute resource.
message StreamRoute {
  // Route name (matches the Kubernetes resource name).
  string name = 1;
  // Kubernetes namespace of the route resource.
  string namespace = 2;
  // Transport protocol kind for this route.
  RouteKind kind = 3;
  // References to parent Gateway listeners this route attaches to.
  repeated ParentRef parent_refs = 4;
  // Ordered list of stream routing rules. First match wins.
  repeated StreamRule rules = 5;
  // Kubernetes labels from the route resource.
  map<string, string> labels = 6;
  // Kubernetes annotations from the route resource.
  map<string, string> annotations = 7;
}

// StreamRule defines a single TCP/UDP/TLS stream routing rule.
message StreamRule {
  // Match conditions. ALL matches must be satisfied (AND semantics).
  repeated StreamMatch matches = 1;
  // Backends to forward matching connections to.
  repeated BackendRef backend_refs = 2;
  // Optional human-readable name for this rule.
  string name = 3;
}

// StreamMatch defines connection matching criteria for a stream route rule.
message StreamMatch {
  // Destination port to match on.
  uint32 port = 1;
  // SNI hostname to match (TLS passthrough routes only).
  string sni_hostname = 2;
  // TLS handling mode for this match.
  TlsRouteMode mode = 3;
}

// ParentRef identifies a parent Gateway resource that a route attaches to.
// Mirrors the Kubernetes Gateway API ParentReference.
message ParentRef {
  // API group of the parent resource (e.g. "gateway.networking.k8s.io").
  string group = 1;
  // Kind of the parent resource (e.g. "Gateway").
  string kind = 2;
  // Namespace of the parent resource.
  string namespace = 3;
  // Name of the parent resource.
  string name = 4;
  // Section name within the parent (e.g. listener name in a Gateway).
  string section_name = 5;
  // Port of the parent listener.
  uint32 port = 6;
}

// BackendRef references a backend service to forward traffic to.
// Mirrors the Kubernetes Gateway API BackendRef with extensions.
message BackendRef {
  // API group of the backend resource (e.g. "" for core Service).
  string group = 1;
  // Kind of the backend resource (e.g. "Service").
  string kind = 2;
  // Namespace of the backend resource.
  string namespace = 3;
  // Name of the backend resource.
  string name = 4;
  // Port on the backend to forward to.
  uint32 port = 5;
  // Traffic weight for this backend (0-100). Used for weighted load balancing
  // when multiple backends are specified.
  uint32 weight = 6;
  // Arbitrary key-value metadata attached to this backend reference.
  map<string, string> metadata = 7;
  // Per-backend filters applied only to traffic forwarded to this backend.
  repeated Filter filters = 8;
}

// RoutePolicy provides per-route overrides for timeout, body size,
// proxy buffering, and connection keepalive settings. When attached
// to an HttpRoute or GrpcRoute, fields set here override the
// dataplane global defaults for that route.
message RoutePolicy {
  // Per-route timeout overrides for request, backend, and connection timeouts.
  RoutePolicyTimeout timeout = 1;
  // Per-route body and header size limits.
  RoutePolicyBodyLimit body_limit = 2;
  // Per-route proxy buffering configuration.
  RoutePolicyProxy proxy = 3;
  // Per-route connection keepalive settings for client and upstream connections.
  RoutePolicyConnection connection = 4;
}

// RoutePolicyTimeout specifies per-route timeout values that override
// the dataplane global timeout defaults.
message RoutePolicyTimeout {
  // Maximum duration for the entire request-response cycle (from first byte received to last byte sent).
  google.protobuf.Duration request = 1;
  // Maximum duration for a single backend request attempt (a single upstream connection).
  google.protobuf.Duration backend_request = 2;
  // Maximum duration to establish a TCP connection to the backend.
  google.protobuf.Duration connect = 3;
  // Maximum duration spent finding a viable upstream backend during retries.
  google.protobuf.Duration next_upstream = 4;
}

// RoutePolicyBodyLimit restricts request body and header sizes on a per-route basis.
message RoutePolicyBodyLimit {
  // Maximum request body size in bytes. Requests exceeding this receive HTTP 413 (Payload Too Large).
  uint64 max_request_body_bytes = 1;
  // Size of the buffer used to read the request body before writing to a temporary file.
  uint64 request_body_buffer_bytes = 2;
  // Maximum combined size of all request headers in bytes.
  uint64 max_request_header_bytes = 3;
}

// RoutePolicyProxy controls HTTP proxy buffering behavior on a per-route basis.
message RoutePolicyProxy {
  // If true, buffer the entire client request body before proxying to the backend.
  google.protobuf.BoolValue request_buffering = 1;
  // If true, buffer the backend response before sending to the client. If false, stream the response.
  google.protobuf.BoolValue response_buffering = 2;
  // Size of each response buffer in bytes (used when response_buffering is enabled).
  uint64 buffer_size = 3;
  // Number of response buffers to allocate (used when response_buffering is enabled).
  uint32 buffer_count = 4;
}

// RoutePolicyConnection controls keepalive behavior for client-facing and
// upstream connections on a per-route basis.
message RoutePolicyConnection {
  // Maximum number of requests allowed on a single keepalive client connection.
  uint32 keepalive_requests = 1;
  // Maximum lifetime of a keepalive client connection.
  google.protobuf.Duration keepalive_time = 2;
  // Maximum idle time before closing a keepalive client connection.
  google.protobuf.Duration keepalive_timeout = 3;
  // Maximum number of idle upstream keepalive connections to maintain in the pool.
  uint32 upstream_keepalive_pool_size = 4;
  // Maximum idle time before closing an upstream keepalive connection.
  google.protobuf.Duration upstream_keepalive_idle = 5;
}

// BackendCluster represents a discovered upstream service with its endpoints,
// timeouts, TLS settings, and optional AI/Token/Wasm plugin configuration.
message BackendCluster {
  // Cluster name (typically the Kubernetes Service name).
  string name = 1;
  // Kubernetes namespace of the backend service.
  string namespace = 2;
  // Protocol for backend connections (HTTP, gRPC, TCP, etc.).
  string protocol = 3;
  // Discovered backend endpoints (IP:port pairs).
  repeated BackendEndpoint endpoints = 4;
  // Connection establishment timeout for new backend connections.
  google.protobuf.Duration connect_timeout = 5;
  // Total request timeout for backend requests.
  google.protobuf.Duration request_timeout = 6;
  // Arbitrary key-value metadata.
  map<string, string> metadata = 7;
  // TLS validation settings for connections to this backend.
  BackendTlsValidation tls_validation = 8;
  // Session persistence configuration override for this backend.
  SessionPersistence session_persistence = 9;
  // Load balancing policy for this backend cluster.
  LoadBalancingPolicy load_balancing = 10;
  // AI service configuration (LLM provider proxy settings).
  AIServiceConfig ai_service = 11;
  // Token rate limiting policy for AI model calls.
  TokenPolicyConfig token_policy = 12;
  // WebAssembly plugin configuration attached to this backend.
  WasmPluginConfig wasm_plugin = 13;
  // Per-backend circuit breaker configuration.
  CircuitBreakerConfig circuit_breaker = 14;
}

// CircuitBreakerConfig defines per-backend circuit breaker thresholds.
// When not set, the data plane uses its default circuit breaker settings.
message CircuitBreakerConfig {
  // Maximum number of concurrent inflight requests allowed to this backend.
  // Requests beyond this limit are rejected immediately with a 503.
  // Set to 0 to disable circuit breaking for this backend.
  uint32 max_inflight_requests = 1;
}

// BackendEndpoint represents a single backend instance discovered by the control plane.
message BackendEndpoint {
  // IP address of the backend instance.
  string address = 1;
  // Port the backend listens on.
  uint32 port = 2;
  // Whether the endpoint is currently healthy based on health checks.
  bool healthy = 3;
  // Availability zone or topology zone of the endpoint (for zone-aware routing).
  string zone = 4;
}

// HeaderMatch defines a request header matching condition.
message HeaderMatch {
  // Header name to match (case-insensitive for HTTP/1.1).
  string name = 1;
  // Expected header value.
  string value = 2;
  // Match type: "Exact", "Prefix", "Suffix", "RegularExpression", or "Present".
  string match_type = 3;
}

// QueryMatch defines a URL query parameter matching condition.
message QueryMatch {
  // Query parameter name to match.
  string name = 1;
  // Expected query parameter value.
  string value = 2;
  // Match type: "Exact" or "RegularExpression".
  string match_type = 3;
}

// Filter represents a request/response processing filter applied to a route or backend.
message Filter {
  // Filter type identifier (e.g. "RequestHeaderModifier", "ResponseHeaderModifier",
  // "URLRewrite", "RequestRedirect", "ExtensionRef").
  string type = 1;
  // Filter-specific configuration. Shape depends on the filter type.
  google.protobuf.Struct config = 2;
}

// SecretMaterial carries TLS certificate and key data referenced by listeners
// and backend connections.
message SecretMaterial {
  // Kubernetes namespace of the Secret resource.
  string namespace = 1;
  // Kubernetes name of the Secret resource.
  string name = 2;
  // PEM-encoded certificate data.
  string cert_pem = 3;
  // PEM-encoded private key data.
  string key_pem = 4;
}

// AIServiceConfig configures an AI/LLM provider proxy for a backend cluster.
// The data plane intercepts requests matching this backend and transforms
// them into provider-specific API calls (OpenAI, Anthropic, Ollama, etc.).
message AIServiceConfig {
  // AI provider identifier (e.g. "openai", "anthropic", "ollama").
  string provider = 1;
  // API format for request/response transformation (e.g. "openai-chat", "anthropic-messages").
  string format = 2;
  // Default model name to use if not specified in the request.
  string model = 3;
  // Authentication configuration for the AI provider API.
  AIServiceAuthConfig auth = 4;
  // Timeout for AI provider API calls.
  google.protobuf.Duration timeout = 5;
}

// AIServiceAuthConfig specifies how the data plane authenticates to an AI provider API.
message AIServiceAuthConfig {
  // Authentication type: "bearer", "api-key", or "basic".
  string type = 1;
  // Reference to a SecretMaterial or Kubernetes Secret containing the credential.
  string secret_ref = 2;
  // HTTP header name to inject the credential into (e.g. "Authorization", "x-api-key").
  string header = 3;
}

// TokenPolicyConfig defines token-based rate limiting for AI model calls.
message TokenPolicyConfig {
  // Maximum tokens allowed per minute.
  uint64 tokens_per_minute = 1;
  // Maximum tokens allowed per hour.
  uint64 tokens_per_hour = 2;
  // Maximum requests allowed per minute.
  uint64 requests_per_minute = 3;
  // Scope of the rate limit: "global" (across all clients) or "per-user".
  string scope = 4;
  // Burst multiplier: allowed short-term overshoot as a ratio of the rate limit.
  double burst = 5;
  // Action when limit is exceeded: "reject" (429), "queue", or "degrade".
  string on_limit = 6;
}

// WasmPluginConfig describes a WebAssembly plugin to be loaded and executed
// by the data plane at specified hook points.
message WasmPluginConfig {
  // Plugin name (matches the Kubernetes WasmPlugin resource name).
  string name = 1;
  // Kubernetes namespace of the plugin resource.
  string namespace = 2;
  // Compiled WebAssembly module bytes.
  bytes wasm_bytes = 3;
  // SHA-256 hash of the Wasm module for integrity verification.
  string sha256 = 4;
  // Hook points where this plugin executes (e.g. "http-request-headers",
  // "http-response-body", "grpc-request").
  repeated string hooks = 5;
  // JSON configuration passed to the plugin at initialization.
  string config_json = 6;
  // Sandbox constraints for Wasm execution.
  WasmSandboxConfig sandbox = 7;
}

// WasmSandboxConfig defines resource limits and security constraints
// for WebAssembly plugin execution.
message WasmSandboxConfig {
  // Maximum memory the Wasm module can allocate, in bytes.
  uint64 max_memory_bytes = 1;
  // Maximum execution time per hook invocation, in milliseconds.
  uint64 max_execution_time_ms = 2;
  // Whether the plugin can make outbound network requests.
  bool allow_network = 3;
  // Whether the plugin can access the host file system.
  bool allow_file_system = 4;
}
